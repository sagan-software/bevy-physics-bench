[package]
name = "bevy-physics-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Reproducible Bevy physics benchmarks for native and WebAssembly runtimes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagan-software/bevy-physics-bench"

[workspace]
members = ["runner"]
default-members = [".", "runner"]
exclude = ["gpu"]
resolver = "2"

[workspace.dependencies]
avian2d = { version = "=0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "xpbd_joints"] }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints"] }
bevy = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy-physics-bench = { version = "0.1.0", path = ".", default-features = false }
bevy_math = "=0.19.1"
bevy_rapier2d = { version = "=0.36.0", default-features = false, features = ["dim2", "headless"] }
bevy_rapier3d = { version = "=0.36.0", default-features = false, features = ["dim3", "headless"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
hex = "0.4.3"
minifb = { version = "0.28.0", default-features = false, features = ["x11"] }
oxijolt = "=1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = "0.38.4"
thiserror = "2.0.21"
wasm-bindgen = "=0.2.129"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["jolt"]
jolt = ["dep:oxijolt"]
native-tuned = ["avian2d/parallel", "avian3d/parallel", "avian2d/simd", "avian3d/simd", "bevy_rapier2d/parallel", "bevy_rapier3d/parallel", "bevy_rapier2d/simd8", "bevy_rapier3d/simd8"]

[dependencies]
avian2d.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_rapier2d.workspace = true
bevy_rapier3d.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxijolt = { workspace = true, optional = true }

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1
