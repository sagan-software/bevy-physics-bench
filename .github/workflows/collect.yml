name: Collect native results
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        profile: [baseline, native-tuned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-releases.mjs
      - name: Collect the pinned compatible engine set
        env:
          PROFILE: ${{ matrix.profile }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          if [ "$PROFILE" = native-tuned ]; then
            cargo run --locked --release --features native-tuned --bin bench -- suite --machine github-ubuntu-24.04 --output results.json
          else
            cargo run --locked --release --bin bench -- suite --machine github-ubuntu-24.04 --output results.json
          fi
      - run: node scripts/validate-results.mjs results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            results.json
            release-report.json
          retention-days: 90
