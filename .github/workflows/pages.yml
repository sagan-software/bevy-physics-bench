name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native viewer dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features viewer -p bevy-physics-bench-runner
      - run: npm ci
      - run: npm run coverage
      - run: npm run validate:results
  build-site:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - run: cargo fmt --all --manifest-path gpu/Cargo.toml -- --check
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: ./scripts/setup-gpu.sh
      - run: cargo test --manifest-path gpu/Cargo.toml
      - run: cargo clippy --manifest-path gpu/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build WebAssembly and the site
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
